version: 2
sources:
  - name: ventas_raw
    schema: raw
    tables:
      - name: ventas
        # Actualidad de la fuente (sintaxis dbt Core 1.9: propiedades de la tabla, fuera de config).
        # Se mide con el instante de carga en raw (_loaded_at, UTC), no con la fecha de negocio.
        # <= 12 h: normal | > 12 h y <= 24 h: advertencia | > 24 h: error.
        loaded_at_field: _loaded_at
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 24, period: hour}
        columns:
          - name: id_venta
            tests: [unique, not_null]
          - name: fecha_venta
            tests: [not_null]
          - name: cantidad
            tests: [not_null]
          - name: precio_unitario
            tests: [not_null]
          - name: _loaded_at
            tests: [not_null]
